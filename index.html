<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Craft Studio + Import/Export</title>
    <style>
        :root {
            --bg: #222222;
            --panel: #333333;
            --accent: #52b788;
            --accent-hover: #74c69d;
            --text: #ffffff;
            --border: #444;
        }

        body {
            margin: 0; background: var(--bg); color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column;
            height: 100vh; overflow: hidden; touch-action: none;
        }

        header {
            background: #111; padding: 12px 24px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--accent);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .logo { font-weight: 800; color: var(--accent); letter-spacing: 1px; font-size: 1.1rem; }

        .main-layout { display: flex; flex: 1; overflow: hidden; }

        /* Toolbar */
        .toolbar {
            width: 75px; background: var(--panel); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; align-items: center; padding: 15px 0; gap: 12px;
        }

        .tool-btn {
            width: 50px; height: 50px; border-radius: 10px; border: 1px solid var(--border);
            background: #2a2a2a; color: white; cursor: pointer; font-size: 1.3rem;
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }

        .tool-btn.active { background: var(--accent); border-color: white; transform: scale(1.05); }

        /* Workspace */
        .workspace { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; overflow: auto; padding: 20px; }
        .canvas-wrapper { position: relative; background: #fff; box-shadow: 0 0 40px rgba(0,0,0,0.6); }
        canvas { display: block; image-rendering: pixelated; }
        #gridLayer { position: absolute; top: 0; left: 0; pointer-events: none; opacity: 0.4; }

        /* Right Sidebar */
        .sidebar { width: 260px; background: var(--panel); border-left: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        
        .section-label { font-size: 0.75rem; color: #aaa; margin-bottom: 8px; font-weight: bold; text-transform: uppercase; }
        
        .palette { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .swatch { width: 35px; height: 35px; border-radius: 6px; cursor: pointer; border: 2px solid #111; }

        .action-group { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
        .btn {
            padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;
            font-size: 0.85rem; display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: 0.2s;
        }
        .btn-primary { background: var(--accent); color: #111; }
        .btn-secondary { background: #444; color: white; }
        .btn:hover { filter: brightness(1.1); }

        /* Hidden Input */
        #fileInput { display: none; }
    </style>
</head>
<body>

<header>
    <div class="logo">CRAFT STUDIO PRO</div>
    <div style="display: flex; gap: 10px;">
        <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">📥 IMPORT</button>
        <button class="btn btn-primary" id="exportBtn">📤 EXPORT PNG</button>
        <input type="file" id="fileInput" accept="image/*">
    </div>
</header>

<div class="main-layout">
    <div class="toolbar">
        <button class="tool-btn active" id="pen">✏️</button>
        <button class="tool-btn" id="eraser">🧹</button>
        <button class="tool-btn" id="toggleGrid">🌐</button>
    </div>

    <div class="workspace">
        <div class="canvas-wrapper">
            <canvas id="mainCanvas"></canvas>
            <canvas id="gridLayer"></canvas>
        </div>
    </div>

    <div class="sidebar">
        <div>
            <div class="section-label">Color</div>
            <input type="color" id="colorPicker" value="#52b788" style="width: 100%; height: 50px; border: none; border-radius: 8px; cursor: pointer; background: none;">
        </div>

        <div>
            <div class="section-label">Recent Materials</div>
            <div class="palette" id="historyPalette"></div>
        </div>

        <div>
            <div class="section-label">Resolution</div>
            <select id="res" style="width: 100%; padding: 10px; background: #222; color: white; border: 1px solid #444; border-radius: 6px;">
                <option value="16">16 x 16 (Small)</option>
                <option value="32" selected>32 x 32 (Standard)</option>
                <option value="64">64 x 64 (Detailed)</option>
            </select>
        </div>

        <div class="action-group">
            <button class="btn btn-secondary" id="clearBtn">🗑️ CLEAR WORKBENCH</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('mainCanvas');
    const gCanvas = document.getElementById('gridLayer');
    const ctx = canvas.getContext('2d');
    const gctx = gCanvas.getContext('2d');
    const fileInput = document.getElementById('fileInput');
    
    let size = 32;
    let viewSize = Math.min(window.innerWidth - 380, window.innerHeight - 150);
    if(window.innerWidth < 800) viewSize = 320; // Tablet optimization

    let isDrawing = false;
    let tool = 'pen';
    let showGrid = true;
    let history = [];

    function init() {
        size = parseInt(document.getElementById('res').value);
        canvas.width = size; canvas.height = size;
        gCanvas.width = size * 10; gCanvas.height = size * 10;
        
        canvas.style.width = viewSize + 'px'; canvas.style.height = viewSize + 'px';
        gCanvas.style.width = viewSize + 'px'; gCanvas.style.height = viewSize + 'px';
        
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, size, size);
        drawGrid();
    }

    function drawGrid() {
        gctx.clearRect(0,0,gCanvas.width, gCanvas.height);
        if(!showGrid) return;
        gctx.strokeStyle = '#000';
        gctx.lineWidth = 0.5;
        for(let i=0; i<=size; i++) {
            gctx.beginPath(); gctx.moveTo(i*10, 0); gctx.lineTo(i*10, gCanvas.height); gctx.stroke();
            gctx.beginPath(); gctx.moveTo(0, i*10); gctx.lineTo(gCanvas.width, i*10); gctx.stroke();
        }
    }

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: Math.floor(((clientX - rect.left) / viewSize) * size),
            y: Math.floor(((clientY - rect.top) / viewSize) * size)
        };
    }

    function paint(e) {
        if(!isDrawing) return;
        const {x, y} = getPos(e);
        if(x < 0 || x >= size || y < 0 || y >= size) return;

        if(tool === 'pen') {
            ctx.fillStyle = document.getElementById('colorPicker').value;
            ctx.fillRect(x, y, 1, 1);
        } else if(tool === 'eraser') {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(x, y, 1, 1);
        }
    }

    // Input/Import Logic
    fileInput.onchange = (e) => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                ctx.clearRect(0,0,size,size);
                ctx.imageSmoothingEnabled = false;
                ctx.drawImage(img, 0, 0, size, size);
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    };

    // Drawing Listeners
    const start = (e) => { isDrawing = true; paint(e); };
    const end = () => { isDrawing = false; saveColor(); };
    
    canvas.addEventListener('mousedown', start);
    window.addEventListener('mouseup', end);
    canvas.addEventListener('mousemove', paint);

    canvas.addEventListener('touchstart', (e) => { start(e); e.preventDefault(); }, {passive: false});
    window.addEventListener('touchend', end);
    canvas.addEventListener('touchmove', (e) => { paint(e); e.preventDefault(); }, {passive: false});

    // Sidebar Controls
    document.getElementById('toggleGrid').onclick = () => { showGrid = !showGrid; drawGrid(); document.getElementById('toggleGrid').classList.toggle('active'); };
    document.getElementById('res').onchange = () => { if(confirm("Changing resolution will clear your work. Continue?")) init(); };
    document.getElementById('clearBtn').onclick = () => { if(confirm("Clear workbench?")) init(); };
    
    document.querySelectorAll('.tool-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            if(btn.id === 'toggleGrid') return;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            tool = btn.id;
        });
    });

    function saveColor() {
        const color = document.getElementById('colorPicker').value;
        if(!history.includes(color)) {
            history.unshift(color);
            if(history.length > 10) history.pop();
            const container = document.getElementById('historyPalette');
            container.innerHTML = '';
            history.forEach(c => {
                const s = document.createElement('div');
                s.className = 'swatch'; s.style.background = c;
                s.onclick = () => document.getElementById('colorPicker').value = c;
                container.appendChild(s);
            });
        }
    }

    document.getElementById('exportBtn').onclick = () => {
        const link = document.createElement('a');
        link.download = 'my-craft-pattern.png';
        link.href = canvas.toDataURL("image/png");
        link.click();
    };

    init();
</script>
</body>
</html>
